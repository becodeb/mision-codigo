<title>Misión Código</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap">
<script src="https://unpkg.com/blockly@11.2.1/blockly.min.js"></script>
<script src="https://unpkg.com/blockly@11.2.1/msg/es.js"></script>
<style>
:root {
  /* Layout: one-screen app. Home = two world portals; play = stage column | code column (stacks under 860px). */
  --ink: #241A4D;
  --ink-soft: #625A8C;
  --paper: #FFF9EE;
  --paper-2: #FFFFFF;
  --line: #EADFC9;
  --sky: #A8E0FF;
  --grass: #5CC14F;
  --sun: #FFC93C;
  --cat: #FF9A3C;
  --cake: #FF6FA5;
  --go: #2DB34A;
  --go-deep: #1E8636;
  --warn: #F0524F;
  --warn-deep: #B93633;
  --space: #0A0F2E;
  --space-2: #131A45;
  --space-3: #1D2560;
  --space-line: #2E3A84;
  --crystal: #5CF0FF;
  --hud: #E6EAFF;
  --hud-soft: #9AA4D6;
  --gold: #FFC93C;
  --bg: var(--paper);
  --panel: var(--paper-2);
  --text: var(--ink);
  --text-soft: var(--ink-soft);
  --border: var(--line);
  --accent: var(--cat);
  --stage-bg: #BDE7FF;
  --focus: #FF8A1F;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-hud: "Chakra Petch", "Consolas", ui-monospace, monospace;
  color-scheme: light;
}
#app[data-world="space"] {
  --bg: var(--space);
  --panel: var(--space-2);
  --text: var(--hud);
  --text-soft: var(--hud-soft);
  --border: var(--space-line);
  --accent: var(--crystal);
  --stage-bg: #070B24;
  --focus: var(--crystal);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; }
p { margin: 0; }
#app { height: 100%; background: var(--bg); color: var(--text); }
.screen { height: 100%; overflow: auto; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 12px/1.2 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); }

/* ---------- Home ---------- */
.home { display: flex; flex-direction: column; gap: 18px; padding-block: 22px 14px; background: var(--paper); color: var(--ink); }
.brand, .worlds, .teacher { width: 100%; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { width: 58px; height: 58px; flex: none; }
.brand h1 { font-size: clamp(32px, 4.6vw, 52px); font-weight: 800; letter-spacing: -.01em; }
.brand p { color: var(--ink-soft); font-size: 17px; }
.worlds { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; min-height: 0; }
.world { display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; border-radius: 30px; overflow: hidden; min-height: 430px; transition: transform .15s ease; }
.world:hover { transform: translateY(-3px); }
.world:active { transform: translateY(2px); }
.world-art { flex: 1; min-height: 190px; position: relative; }
.world-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.world-info { padding: 18px 24px 22px; display: grid; gap: 8px; }
.world h2 { font-size: clamp(30px, 3.2vw, 42px); font-weight: 800; }
.world p { font-size: 16px; max-width: 44ch; }
.grade { font: 700 13px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 13px/1 var(--font-body); padding: 6px 10px; border-radius: 999px; }
.world-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.world-stars { display: inline-flex; align-items: center; gap: 6px; font: 700 16px/1 var(--font-hud); font-variant-numeric: tabular-nums; }
.world-stars svg { width: 20px; height: 20px; fill: var(--gold); }
.cta { font: 800 20px/1 var(--font-display); padding: 12px 20px 10px; border-radius: 16px; }
.world-michi { background: #FFFFFF; color: var(--ink); box-shadow: 0 8px 0 #F1D7B4; }
.world-michi .grade { color: #D96A0B; }
.world-michi .chip { background: #FFF0DD; color: #8A4A0E; }
.world-michi .cta { background: var(--cat); color: #fff; box-shadow: 0 4px 0 #D96A0B; }
.world-space { background: var(--space-2); color: var(--hud); box-shadow: 0 8px 0 #060920; }
.world-space .grade { color: var(--crystal); }
.world-space .chip { background: #222C6E; color: #CFE0FF; }
.world-space .cta { background: var(--crystal); color: #06223A; box-shadow: 0 4px 0 #1F9FB8; }
.teacher { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: 18px; background: #FFF1DA; color: var(--ink); font-size: 14px; }
.teacher strong { font: 700 12px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; color: #B4580A; }
.teacher label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.teacher input { width: 18px; height: 18px; accent-color: var(--cat); }
.tbtn { border: 2px solid #E9C894; background: #fff; border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
.tbtn.danger { border-color: var(--warn); color: var(--warn-deep); }
.teacher .note { color: var(--ink-soft); margin-left: auto; }

/* ---------- Bars & icon buttons ---------- */
.bar { display: flex; align-items: center; gap: 12px; padding-block: 12px; background: var(--panel); border-bottom: 2px solid var(--border); }
.bar-title { flex: 1; min-width: 0; display: grid; gap: 2px; }
.bar h2 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-tools { display: flex; gap: 8px; }
.ibtn { width: 48px; height: 48px; flex: none; border-radius: 14px; border: 2px solid var(--border); background: var(--panel); color: var(--text); display: grid; place-items: center; box-shadow: 0 3px 0 var(--border); }
.ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.ibtn svg { width: 24px; height: 24px; }
.ibtn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
#app[data-world="space"] .ibtn[aria-pressed="true"] { color: #06223A; }
.bar-stars { display: inline-flex; align-items: center; gap: 6px; font: 700 17px/1 var(--font-hud); font-variant-numeric: tabular-nums; }
.bar-stars svg { width: 22px; height: 22px; fill: var(--gold); }
svg.i { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i .f { fill: currentColor; stroke: none; }

/* ---------- Map ---------- */
.map { display: flex; flex-direction: column; }
.map-body { flex: 1; padding-block: 24px 32px; }
.map-intro { max-width: 1080px; margin: 0 auto 18px; color: var(--text-soft); font-size: 16px; }
.levels { list-style: none; margin: 0 auto; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; max-width: 1080px; }
.lvl { width: 100%; height: 100%; min-height: 158px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; text-align: left; padding: 14px 14px 12px; border-radius: 22px; border: 3px solid var(--border); background: var(--panel); color: var(--text); box-shadow: 0 5px 0 var(--border); position: relative; }
.lvl:not(:disabled):hover { transform: translateY(-2px); }
.lvl-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.lvl-num { font: 800 38px/0.9 var(--font-display); }
.lvl-name { font: 700 16px/1.2 var(--font-display); }
.lvl-concept { font: 600 12px/1.2 var(--font-hud); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lvl-icons { display: flex; gap: 4px; }
.lvl-icons span { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.lvl-icons img { width: 24px; height: 24px; }
.lvl-stars { display: flex; gap: 2px; }
.lvl-stars svg { width: 22px; height: 22px; fill: var(--border); }
.lvl-stars svg.on { fill: var(--gold); }
.lvl.locked { opacity: .5; }
.lvl .lock { width: 22px; height: 22px; color: var(--text-soft); }
.lvl.current { border-color: var(--accent); box-shadow: 0 5px 0 var(--accent); animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ---------- Play ---------- */
.play { display: flex; flex-direction: column; }
.play-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: 16px; padding-block: 14px 16px; }
.stage-col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.stage-wrap { position: relative; flex: 1; min-height: 220px; border-radius: 22px; overflow: hidden; background: var(--stage-bg); border: 3px solid var(--border); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(10, 15, 46, .78); color: var(--hud); font: 700 15px/1 var(--font-hud); letter-spacing: .06em; font-variant-numeric: tabular-nums; border: 1px solid #34408C; }
.hud img { width: 18px; height: 18px; }
.bubble { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 18px; background: #fff; color: var(--ink); box-shadow: 0 4px 0 rgba(36, 26, 77, .18); animation: rise .3s ease-out; }
.bubble p { font: 700 18px/1.25 var(--font-display); }
.bubble .hint { font: 400 15px/1.35 var(--font-body); margin-top: 2px; }
.bubble .face { width: 52px; height: 56px; flex: none; }
.bubble .face svg { width: 100%; height: 100%; }
.bubble.good { background: #E9FBE9; }
.bubble.bad { background: #FFF0EE; }
#app[data-world="space"] .bubble { background: rgba(13, 19, 58, .94); color: var(--hud); border: 1px solid #3A4796; box-shadow: none; padding: 10px 14px; }
#app[data-world="space"] .bubble p { font: 600 16px/1.3 var(--font-body); }
#app[data-world="space"] .bubble .hint { color: #C4CCF2; font-size: 14px; }
#app[data-world="space"] .bubble.bad { border-color: var(--warn); }
#app[data-world="space"] .bubble.good { border-color: var(--go); }
.bubble .tag { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #222C6E; }
.bubble.bad .tag { background: var(--warn); color: #fff; }
.bubble.good .tag { background: var(--go); color: #fff; }
.bubble .tag svg { width: 20px; height: 20px; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

.goal { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.goal p { font-size: 15px; color: var(--text-soft); min-width: 0; }
.goal-pic { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; background: #FFF0DD; }
.goal-pic svg { height: 40px; width: auto; }
.concept-chip { flex: none; font: 600 12px/1 var(--font-hud); letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px; border-radius: 8px; background: #222C6E; color: var(--crystal); }
.controls { display: flex; gap: 12px; }
.btn-run { flex: 1; height: 72px; border: 0; border-radius: 20px; background: var(--go); color: #fff; font: 800 26px/1 var(--font-display); display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 6px 0 var(--go-deep); }
.btn-run svg { width: 34px; height: 34px; }
.btn-run:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-deep); }
.btn-run.running { background: var(--warn); box-shadow: 0 6px 0 var(--warn-deep); }
.btn-run.pulse { animation: runpulse 1s ease-in-out 3; }
@keyframes runpulse { 50% { transform: scale(1.04); box-shadow: 0 6px 0 var(--go-deep), 0 0 0 10px rgba(45, 179, 74, .25); } }
.btn-reset { width: 72px; height: 72px; flex: none; border-radius: 20px; border: 3px solid var(--border); background: var(--panel); color: var(--text); display: grid; place-items: center; box-shadow: 0 6px 0 var(--border); }
.btn-reset svg { width: 32px; height: 32px; }
.btn-reset:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--border); }

.code-col { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-radius: 22px; overflow: hidden; border: 3px solid var(--border); background: var(--panel); }
.code-head { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-bottom: 2px solid var(--border); min-height: 54px; }
.code-title { font: 800 18px/1 var(--font-display); }
.meter { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.meter-label { font: 600 13px/1 var(--font-hud); letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; color: var(--text-soft); }
.meter-bar { width: 90px; height: 10px; border-radius: 5px; background: #222C6E; overflow: hidden; }
.meter-bar i { display: block; height: 100%; background: var(--crystal); transition: width .2s; }
.meter.full .meter-label { color: var(--gold); }
.meter.full .meter-bar i { background: var(--gold); }
.slots { display: flex; gap: 6px; }
.slots i { width: 26px; height: 26px; border-radius: 8px; border: 3px dashed #D9C7A6; transition: background .2s, border-color .2s; }
.slots i.on { background: #3D8BFF; border: 3px solid #1F5DBD; }
.slots.full i.on { background: var(--cat); border-color: #D96A0B; }
.clear-btn { border: 2px solid var(--border); background: transparent; color: var(--text-soft); border-radius: 12px; height: 38px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.clear-btn svg { width: 20px; height: 20px; }
.clear-btn.armed { background: var(--warn); border-color: var(--warn); color: #fff; }
.blockly { flex: 1; min-height: 0; position: relative; }
.shield { position: absolute; inset: 0; z-index: 5; cursor: progress; }
.noeditor { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-soft); }

/* Blockly tweaks */
.blocklyMainBackground { stroke: none !important; }
.mc-glow > .blocklyPath { animation: glow .9s ease-in-out infinite alternate; }
@keyframes glow { from { filter: drop-shadow(0 0 0 rgba(255, 201, 60, 0)); } to { filter: drop-shadow(0 0 5px #FFC93C) drop-shadow(0 0 12px #FFC93C); } }
.tapnum > rect { fill: #fff !important; stroke: rgba(0, 0, 0, .12); }
.tapnum > text { fill: #B85A00 !important; font-family: var(--font-display) !important; font-weight: 800 !important; font-size: 22px !important; }
.blocklyWidgetDiv .blocklyMenu, .blocklyDropDownDiv { font-family: var(--font-body); }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(20, 16, 50, .5); }
.modal-card { width: min(600px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); color: var(--text); border-radius: 28px; padding: 26px 26px 22px; box-shadow: 0 10px 0 rgba(0, 0, 0, .15), 0 30px 60px rgba(0, 0, 0, .3); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); display: grid; gap: 18px; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
#app[data-world="space"] .modal-card { border: 1px solid #3A4796; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.mbtn { min-height: 56px; padding: 0 20px; border-radius: 16px; border: 3px solid var(--border); background: var(--panel); color: var(--text); font: 800 20px/1 var(--font-display); display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 0 var(--border); }
.mbtn svg { width: 26px; height: 26px; }
.mbtn.primary { background: var(--go); border-color: var(--go); color: #fff; box-shadow: 0 4px 0 var(--go-deep); }
.mbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
.robi-intro { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; }
.robi-intro .robi { width: 120px; height: 130px; }
.speech { position: relative; background: #EAF6FF; border-radius: 22px; padding: 16px 18px; font: 700 21px/1.3 var(--font-display); color: var(--ink); }
.speech::before { content: ""; position: absolute; left: -12px; top: 42%; border: 12px solid transparent; border-right-color: #EAF6FF; border-left: 0; }
.speech .again { margin-top: 10px; border: 0; background: #fff; border-radius: 12px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 var(--font-body); color: #1F5DBD; }
.speech .again svg { width: 20px; height: 20px; }
.win { text-align: center; justify-items: center; }
.win .robi { width: 110px; height: 118px; }
.win h3 { font-size: 40px; font-weight: 800; }
.win p { font-size: 18px; color: var(--text-soft); max-width: 40ch; }
.win-stars { display: flex; gap: 8px; justify-content: center; }
.win-stars svg { width: 64px; height: 64px; fill: var(--border); }
.win-stars svg.on { fill: var(--gold); animation: starpop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.win-stars svg:nth-child(2).on { animation-delay: .15s; }
.win-stars svg:nth-child(3).on { animation-delay: .3s; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.win .modal-actions { justify-content: center; }

/* Concept cards (Base Estelar) */
.concept h3 { font-size: 30px; font-weight: 800; }
.concept .lead { font-size: 17px; line-height: 1.5; color: var(--text-soft); max-width: 60ch; }
.cv { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center; padding: 18px; border-radius: 18px; background: #0C1236; border: 1px solid #2B3678; min-height: 170px; }
.stack { display: flex; flex-direction: column; gap: 3px; }
.mb { display: flex; align-items: center; gap: 6px; width: max-content; font: 700 14px/1 var(--font-body); color: #fff; padding: 9px 12px; border-radius: 9px; transition: box-shadow .2s, transform .2s; }
.mb img { width: 18px; height: 18px; }
.mb.on, .mbc.on > .h { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px var(--gold); transform: translateX(4px); }
.mb.events { background: #FFBF00; color: #3D2E00; border-radius: 16px 16px 9px 9px; }
.mb.motion { background: #4C97FF; }
.mb.action { background: #9966FF; }
.mb.ctrl { background: #FFAB19; }
.mb.shape { width: 46px; height: 34px; padding: 0; justify-content: center; font-size: 18px; }
.mbc { background: #FFAB19; border-radius: 9px; padding-bottom: 12px; width: max-content; color: #fff; font: 700 14px/1 var(--font-body); }
.mbc > .h { padding: 9px 12px; display: flex; gap: 6px; align-items: center; border-radius: 9px; transition: box-shadow .2s, transform .2s; }
.mbc > .in { margin-left: 14px; display: flex; flex-direction: column; gap: 3px; padding: 4px 6px 4px 0; background: #0C1236; border-radius: 8px 0 0 8px; }
.mbc > .else { padding: 6px 12px; }
.cnt { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 11px; background: #fff; color: #B4580A; font: 700 14px/1 var(--font-hud); font-variant-numeric: tabular-nums; }
.lamp { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .25); }
.lamp.yes.show { background: #48F08A; box-shadow: 0 0 10px #48F08A; }
.lamp.no.show { background: #FF6B6B; box-shadow: 0 0 10px #FF6B6B; }
.equals { font: 800 34px/1 var(--font-display); color: var(--crystal); }
.pairs { display: flex; gap: 6px; }
.pair { display: flex; gap: 3px; padding: 5px; border-radius: 12px; border: 2px dashed transparent; transition: border-color .2s, background .2s; }
.pair.on { border-color: var(--gold); background: rgba(255, 201, 60, .12); }
.mini { --cell: 46px; position: relative; width: calc(var(--cols) * var(--cell)); height: calc(var(--rows) * var(--cell)); flex: none; }
.mini > * { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))); }
.mc { border-radius: 10px; background: rgba(120, 140, 255, .08); box-shadow: inset 0 0 0 1px rgba(120, 140, 255, .22); transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))) scale(.92); }
.mwall::after { content: ""; position: absolute; inset: 9px; border-radius: 42% 56% 46% 52%; background: #7E8499; box-shadow: inset -4px -4px 0 #60657A; }

function asteroidSVG(rng, r) {
  let d = '';
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rr = r * (.8 + rng() * .28);
    d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1);
  }
  const rot = Math.floor(rng() * 360);
  return `<g transform="rotate(${rot})"><path d="${d}Z" fill="#7E8499" stroke="#565B70" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${(-r * .3).toFixed(1)}" cy="${(-r * .2).toFixed(1)}" r="${(r * .22).toFixed(1)}" fill="#656A7F"/>
    <circle cx="${(r * .3).toFixed(1)}" cy="${(r * .25).toFixed(1)}" r="${(r * .15).toFixed(1)}" fill="#656A7F"/>

}

const HAS_BLOCKLY = typeof window.Blockly !== 'undefined';

let FieldTapNumber = null;

function setupBlockly() {
  if (!HAS_BLOCKLY) return;
  try { Blockly.config.snapRadius = 44; Blockly.config.connectingSnapRadius = 64; } catch (e) { /* older API */ }

  FieldTapNumber = class extends Blockly.Field {
    constructor(value, min, max) {
      super(Blockly.Field.SKIP_SETUP);
      this.min_ = Number.isFinite(min) ? min : 2;
      this.max_ = Number.isFinite(max) ? max : 9;
      this.SERIALIZABLE = true;
      this.CURSOR = 'pointer';
      this.setValue(value ?? this.min_);
    }
    static fromJson(o) { return new this(o.value, o.min, o.max); }
    initView() { super.initView(); const g = this.getSvgRoot(); if (g) g.classList.add('tapnum'); }
    doClassValidation_(v) {
      const n = Math.round(Number(v));
      if (!Number.isFinite(n)) return null;
      return Math.min(this.max_ ?? 99, Math.max(this.min_ ?? 1, n));
    }
    showEditor_() {
      let n = Number(this.getValue()) + 1;
      if (n > this.max_) n = this.min_;
      this.setValue(n);
      sfx('tick');
    }
  };
  Blockly.fieldRegistry.register('field_tapnum', FieldTapNumber);

  const im = (src, w, h, alt) => ({ type: 'field_image', src, width: w, height: h, alt });

function startConceptAnim(root, C) {

    }
    root.querySelectorAll('[data-k]').forEach(e => e.classList.toggle('on', f.k.includes(e.dataset.k)));
    root.querySelectorAll('[data-g]').forEach(e => e.classList.toggle('got', f.got.includes(+e.dataset.g)));
    root.querySelectorAll('[data-m]').forEach(e => e.classList.toggle('show', f.m.includes(e.dataset.m)));
    root.querySelectorAll('[data-count]').forEach(e => { const v = f.c && f.c[e.dataset.count]; e.textContent = v ?? e.dataset.def; });

function tween(ms, fn) {
  const dur = ms * speed();
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      if (abortRun) { res(); return; }
      const t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

function tweenRaw(ms, fn) {

}

/* ================= simulation ================= */
function compileChain(block) {
  const out = [];
  for (let b = block; b; b = b.getNextBlock()) {
    if (b.isInsertionMarker && b.isInsertionMarker()) continue;
    out.push(compileBlock(b));
  }
  return out;
}
function compileBlock(b) {
  const body = name => compileChain(b.getInputTargetBlock(name));
  switch (b.type) {
    case 'k_repeat': case 's_repeat': return { op: 'repeat', id: b.id, n: Math.max(0, Math.floor(Number(b.getFieldValue('N')) || 0)), body: body('DO') };
    case 's_if': return { op: 'if', id: b.id, cond: b.getFieldValue('C'), body: body('DO') };
    case 's_ifelse': return { op: 'ifelse', id: b.id, cond: b.getFieldValue('C'), body: body('DO'), else: body('ELSE') };
    default: return { op: OPS[b.type] || 'noop', id: b.id };
  }
}
function simMichi(prog, L) {
  if (!prog.length) return { events: [], result: { ok: false, reason: 'empty' } };
  const ev = [], puddle = new Set(L.puddles || []);
  const st = { x: L.party ? 3 : 0, over: false, end: null, steps: 0 };
  const exec = list => {
    for (const n of list) {
      if (st.end) return;
      if (++st.steps > 400) { st.end = { ok: false, reason: 'long' }; return; }
      if (n.op === 'repeat') { for (let k = 0; k < n.n && !st.end; k++) { ev.push({ t: 'loop', id: n.id }); exec(n.body); } continue; }
      if (L.party) {
        if (n.op === 'go' || n.op === 'back') {
          const d = n.op === 'go' ? 1 : -1, to = st.x + d;
          if (to < 0 || to > 6) ev.push({ t: 'bump', id: n.id, at: st.x, dir: d });
          else { ev.push({ t: 'walk', id: n.id, from: st.x, to }); st.x = to; }
        } else if (n.op === 'jump') ev.push({ t: 'hop', id: n.id });
        else if (n.op === 'spin') ev.push({ t: 'spin', id: n.id });
        else if (n.op === 'meow') ev.push({ t: 'meow', id: n.id });
        continue;
      }
      if (n.op === 'go') {
        const to = st.x + 1;
        if (to > 6) { ev.push({ t: 'walkoff', id: n.id, from: st.x }); st.end = { ok: false, reason: 'off' }; return; }
        ev.push({ t: 'walk', id: n.id, from: st.x, to }); st.x = to;
        if (puddle.has(to)) { ev.push({ t: 'splash', id: n.id, at: to }); st.end = { ok: false, reason: 'splash' }; return; }
        if (to === L.cake) { ev.push({ t: 'eat', id: n.id }); st.end = { ok: true }; return; }
      } else if (n.op === 'jump') {
        const to = st.x + 2;
        if (st.x + 1 === L.cake) st.over = true;
        if (to > 6) { ev.push({ t: 'jumpoff', id: n.id, from: st.x }); st.end = { ok: false, reason: st.over ? 'over' : 'off' }; return; }
        ev.push({ t: 'jump', id: n.id, from: st.x }); st.x = to;
        if (puddle.has(to)) { ev.push({ t: 'splash', id: n.id, at: to }); st.end = { ok: false, reason: 'splash' }; return; }
        if (to === L.cake) { ev.push({ t: 'eat', id: n.id }); st.end = { ok: true }; return; }
      }
    }
  };
  exec(prog);
  if (!st.end) {
    if (L.party) st.end = { ok: true };
    else if (st.over || st.x > L.cake) st.end = { ok: false, reason: 'over' };
    else st.end = { ok: false, reason: 'short', left: L.cake - st.x };
  }
  return { events: ev, result: st.end };
}
function simSpace(prog, L) {
  if (!prog.length) return { events: [], result: { ok: false, reason: 'empty' } };
  const rows = L.map.length, cols = L.map[0].length, crystals = new Set();
  let x = 0, y = 0, dir = L.dir;
  L.map.forEach((r, j) => [...r].forEach((c, i) => { if (c === 'A') { x = i; y = j; } if (c === '*') crystals.add(i + ',' + j); }));
  const total = crystals.size, ev = [];
  let got = 0, end = null, steps = 0;
  const cell = (i, j) => (i < 0 || j < 0 || i >= cols || j >= rows) ? null : L.map[j][i];
  const solid = k => k === '#' || k === 'P';
  const cond = c => {
    const [dx, dy] = D4[dir];
    if (c === 'CRYSTAL') return crystals.has(x + ',' + y);
    const k = cell(x + dx, y + dy);
    if (c === 'PATH') return k !== null && !solid(k);
    if (c === 'ROCK') return solid(k);
    return false;
  };
  const exec = list => {
    for (const n of list) {
      if (end) return;
      if (++steps > 2000) { end = { ok: false, reason: 'long' }; return; }
      switch (n.op) {
        case 'repeat': for (let k = 0; k < n.n && !end; k++) { ev.push({ t: 'loop', id: n.id }); exec(n.body); } break;
        case 'if': { const ok = cond(n.cond); ev.push({ t: 'check', id: n.id, ok, cond: n.cond, x, y, dir }); if (ok) exec(n.body); break; }
        case 'ifelse': { const ok = cond(n.cond); ev.push({ t: 'check', id: n.id, ok, cond: n.cond, x, y, dir }); exec(ok ? n.body : n.else); break; }
        case 'move': {
          const [dx, dy] = D4[dir], k = cell(x + dx, y + dy);
          if (k === null) { ev.push({ t: 'lost', id: n.id, x, y, dir }); end = { ok: false, reason: 'lost' }; return; }
          if (solid(k)) { ev.push({ t: 'crash', id: n.id, x, y, dir }); end = { ok: false, reason: 'crash' }; return; }
          ev.push({ t: 'move', id: n.id, fx: x, fy: y, x: x + dx, y: y + dy }); x += dx; y += dy; break;
        }
        case 'left': dir = (dir + 3) % 4; ev.push({ t: 'turn', id: n.id, d: -1 }); break;
        case 'right': dir = (dir + 1) % 4; ev.push({ t: 'turn', id: n.id, d: 1 }); break;
        case 'collect': {
          const key = x + ',' + y;
          if (crystals.has(key)) {
            crystals.delete(key); got++; ev.push({ t: 'collect', id: n.id, x, y, got });
            if (got === total) { ev.push({ t: 'win' }); end = { ok: true }; return; }
          } else { ev.push({ t: 'nocrystal', id: n.id, x, y }); end = { ok: false, reason: 'nocrystal' }; return; }
          break;
        }
      }
    }
  };
  exec(prog);
  if (!end) end = { ok: false, reason: 'missing', left: total - got };
  return { events: ev, result: end };
}

/* ================= run ================= */
function stopRun() { if (running) abortRun = true; }
async function run() {
  if (!ws) return;
  if (running) { stopRun(); return; }
  ac();
  const L = level(), hat = getHat();
  if (!hat) return;
  const prog = compileChain(hat.getNextBlock());
  hush(); hideBubble();
  stage().reset();
  const sim = world === 'michi' ? simMichi(prog, L) : simSpace(prog, L);
  if (sim.result.reason === 'empty') { showBubble(failText(sim.result), 'bad'); pointAtHat(); return; }
  running = true; abortRun = false; setRunUI(true);
  if (innerWidth < 860) $('.stage-wrap').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  for (const ev of sim.events) {
    if (abortRun) break;
    if (ev.id && ws && ws.getBlockById(ev.id)) { try { ws.highlightBlock(ev.id); } catch (e) { /* ignore */ } }
    await stage().play(ev);
  }
  try { ws && ws.highlightBlock(null); } catch (e) { /* ignore */ }
  const aborted = abortRun;
  running = false; abortRun = false;
  if (!ws) return;
  setRunUI(false);

  finish(sim.result);
}
function finish(r) {
  const L = level();
  if (r.ok) {
    const n = countBlocks();
    let stars = 3;
    if (!L.party) stars = world === 'michi' ? (n <= L.optimal ? 3 : 2) : (n <= L.optimal ? 3 : n <= L.optimal + 2 ? 2 : 1);
    const prev = DB.progress[world][levelIdx] || 0;
    DB.progress[world][levelIdx] = Math.max(prev, stars); persist();
    sfx('win'); confetti();
    setTimeout(() => showWin(stars, n), world === 'michi' ? 500 : 700);
  } else {
    failCount++;
    sfx(r.reason === 'missing' || r.reason === 'short' ? 'fail' : 'fail');
    const hint = world === 'space' && failCount >= 2 ? L.hint : '';
    showBubble(failText(r), 'bad', { hint });
  }
}
async function showWin(stars, n) {

  let title, msg;
  if (world === 'michi') {
    title = L.party ? '¡Qué baile!' : pick(['¡Lo lograste!', '¡Muy bien!', '¡Genial!']);
    msg = L.party ? 'Michi bailó con tu programa. Podés cambiar los bloques e inventar otro baile.'
      : stars === 3 ? 'Michi llegó a su torta.' : 'Michi llegó a su torta. ¿Podés hacerlo con menos bloques?';
  } else {
    title = '¡Misión cumplida!';
    msg = n <= L.optimal ? `Usaste ${n} bloques: es la solución más corta.` : `Usaste ${n} bloques. Se puede con ${L.optimal}. ¿Te animás?`;
  }
  if (last && !L.party) msg += ` ¡Terminaste ${W.name}!`;
  const lead = world === 'michi' ? robiSVG() : `<svg viewBox="-50 -50 100 100" width="96" height="96" aria-hidden="true">${SPACE_DEFS('w-')}<g transform="rotate(-30)">${astroSVG().replace(/url\(#/g, 'url(#w-')}</g></svg>`;
  const p = openModal({
    cls: 'win',
    html: `${lead}<h3>${title}</h3><div class="win-stars" aria-label="${stars} de 3 estrellas">${starsHTML(stars)}</div><p>${msg}</p>`,
    actions: [
      { key: 'again', label: L.party ? 'Bailar otra vez' : 'Otra vez', icon: 'retry' },
      { key: 'next', label: last ? 'Volver al mapa' : 'Siguiente', icon: last ? 'map' : 'next', primary: true },
    ],
  });
  if (world === 'michi') say(`${title} ${msg}`);

const HAND = '<svg viewBox="0 0 64 72" width="64" height="72" aria-hidden="true"><path d="M22 6c3.3 0 6 2.7 6 6v20.5l2.6-1.3c3-1.4 6.4-.2 7.6 2.6l.6 1.4 1.8-.8c3-1.3 6.3.1 7.4 3l.5 1.2c3-1 6.3.9 6.8 4l.7 4.4c1.4 9-2.6 17.2-10.5 21.4l-1.7.9c-2.9 1.5-6.1 2.3-9.4 2.3h-3.8c-6.5 0-12.5-3.4-15.8-9l-8-13.4c-1.6-2.7-.8-6.2 1.9-7.8 2.4-1.5 5.6-.9 7.3 1.4l2.9 4V12c0-3.3 2.7-6 6-6z" fill="#fff" stroke="#241A4D" stroke-width="3.5" stroke-linejoin="round"/><path d="M28 36v9M37 38v7M45 41v5" stroke="#241A4D" stroke-width="3" stroke-linecap="round" opacity=".3"/></svg>';

}
function makeGhost(block) {

async function handDemo(L) {
  if (!ws) return;
  const fly = ws.getFlyout && ws.getFlyout();

  if (innerWidth < 860) { $('.code-col').scrollIntoView({ block: 'center', behavior: 'smooth' }); await sleep(450); }
  const layer = $('#demo');

  let hx = innerWidth * .5, hy = innerHeight + 60;
  setHand(hx, hy);
  const moveHand = async (x, y, ms) => { const x0 = hx, y0 = hy; await tweenRaw(ms, t => { const e = ease(t); setHand(lerp(x0, x, e), lerp(y0, y, e)); }); hx = x; hy = y; };
  const fws = fly.getWorkspace();
  let anchor = getHat();
  while (anchor && anchor.getNextBlock()) anchor = anchor.getNextBlock();
  const ao = originOf(anchor), off = anchor.nextConnection.getOffsetInBlock();
  let dest = { x: ao.x + off.x * ao.sc, y: ao.y + off.y * ao.sc };
  const ghosts = [];
  for (const type of L.intro.demo) {
    if (skip) break;
    const src = fws.getTopBlocks(false).find(b => b.type === type);
    if (!src) continue;
    const g = makeGhost(src), o = g.o;
    const grabX = o.r.left + Math.min(30, o.r.width / 2), grabY = o.r.top + o.r.height / 2;
    await moveHand(grabX, grabY, 750);
    if (skip) break;
    hand.classList.add('press'); sfx('pop');
    g.place(o.x, o.y); layer.appendChild(g.el);
    await sleep(250);
    const target = ghosts.length && L.intro.into ? (() => {
      const parent = ghosts[ghosts.length - 1], io = parent.src.getInput('DO').connection.getOffsetInBlock();
      return { x: parent.g.x + io.x * parent.g.o.sc, y: parent.g.y + io.y * parent.g.o.sc };
    })() : dest;
    const dx = grabX - o.x, dy = grabY - o.y;
    await tweenRaw(1150, t => {
      const e = ease(t), x = lerp(o.x, target.x, e), y = lerp(o.y, target.y, e) - Math.sin(t * Math.PI) * 50;

  }

      }
    }
  }
  if (!skip) {
    const rb = $('#btn-run').getBoundingClientRect();
    await moveHand(rb.left + rb.width / 2, rb.top + rb.height / 2, 800);
    if (!skip) {
      hand.classList.add('press'); sfx('pop');
      const ring = document.createElement('div'); ring.className = 'ring';
      ring.style.left = (rb.left + rb.width / 2) + 'px'; ring.style.top = (rb.top + rb.height / 2) + 'px';
      layer.appendChild(ring);
      await sleep(600); hand.classList.remove('press');
    }
  }
  ghosts.forEach(x => x.g.el.classList.add('fade'));
  await sleep(skip ? 0 : 400);
  layer.hidden = true; layer.innerHTML = ''; layer.onclick = null;
  if (world === 'michi') say('¡Ahora te toca a vos!');
}

  const cv = $('#confetti'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.hidden = false; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cols = world === 'space' ? ['#5CF0FF', '#FFC93C', '#B08BFF', '#FFFFFF', '#48F08A'] : ['#FF6FA5', '#FFC93C', '#3D8BFF', '#5CC14F', '#FF9A3C', '#B45CFF'];
  const ps = Array.from({ length: 150 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4,
    a: Math.random() * 6, va: (Math.random() - .5) * .4, c: pick(cols),
  }));
  const t0 = performance.now();
  const frame = now => {
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - t / 2600); ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if (t < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

/* ================= wiring ================= */
function wire() {
  $$('[data-world-btn]').forEach(b => b.addEventListener('click', () => { ac(); openWorld(b.dataset.worldBtn); }));
  $('#map-back').innerHTML = ICON.home;
  $('#map-back').addEventListener('click', goHome);
  $('#play-back').innerHTML = ICON.map;
  $('#play-back').addEventListener('click', () => openWorld(world));
  $('#btn-help').innerHTML = ICON.bulb;
  $('#btn-help').addEventListener('click', () => { if (!running) showIntro(); });
  $('#btn-speed').addEventListener('click', () => { DB.fast = !DB.fast; persist(); syncToggles(); });
  $('#btn-sound').addEventListener('click', () => { DB.sound = !DB.sound; persist(); if (!DB.sound) hush(); syncToggles(); });
  $('#btn-run').addEventListener('click', run);
  $('#btn-reset').innerHTML = ICON.retry;
  $('#btn-reset').addEventListener('click', () => { stopRun(); hideBubble(); if (!running) stage().reset(); });
  const clear = $('#btn-clear');
  const clearIdle = () => { clear.classList.remove('armed'); clear.innerHTML = `${ICON.trash}<span>Borrar</span>`; };
  clearIdle();
  let armTimer = null;
  clear.addEventListener('click', () => {
    if (!ws || running) return;
    if (!clear.classList.contains('armed')) {
      clear.classList.add('armed'); clear.innerHTML = `${ICON.trash}<span>¿Seguro?</span>`;
      clearTimeout(armTimer); armTimer = setTimeout(clearIdle, 2500); return;
    }
    clearTimeout(armTimer); clearIdle();
    const hat = getHat();
    ws.getTopBlocks(false).forEach(b => { if (b !== hat) b.dispose(false); });
    const next = hat && hat.getNextBlock(); if (next) next.dispose(false);
    stage().reset(); hideBubble();
  });
  $('#unlock-all').addEventListener('change', e => { DB.unlockAll = e.target.checked; persist(); });
  $('#reset-progress').addEventListener('click', () => { $('#reset-confirm').hidden = false; $('#reset-progress').hidden = true; });
  $('#reset-no').addEventListener('click', () => { $('#reset-confirm').hidden = true; $('#reset-progress').hidden = false; });
  $('#reset-yes').addEventListener('click', () => {
    const keep = { sound: DB.sound, fast: DB.fast };
    DB = Object.assign(blankDB(), keep); persist();
    $('#reset-confirm').hidden = true; $('#reset-progress').hidden = false; renderHome();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal('esc'); });
  syncToggles();
}

/* ================= boot ================= */
async function boot(data) {
  setupBlockly();
  renderHomeArt();
  wire();
  try { await Promise.race([Promise.all([document.fonts.load('800 16px "Baloo 2"'), document.fonts.load('700 13px "Atkinson Hyperlegible"')]), sleep(1500)]); } catch (e) { /* fonts optional */ }
  if (data && data.world && WORLDS[data.world]) {
    world = data.world; app.dataset.world = world;
    if (data.screen === 'play' && Number.isInteger(data.level)) { DB.seen[world + ':' + data.level] = 1; openLevel(data.level); }
    else openWorld(world);
  } else goHome();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) {
  try { hot.snapshot(() => ({ world, level: levelIdx, screen: $('#scr-play').hidden ? ($('#scr-map').hidden ? 'home' : 'map') : 'play' })); } catch (e) { /* ignore */ }
}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
